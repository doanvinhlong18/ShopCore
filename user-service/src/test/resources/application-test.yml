spring:
  datasource:
    url: jdbc:h2:mem:user-db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true

shopcore:
  security:
    jwt:
      private-key-location: classpath:keys/test-private.pem
      public-key-location: classpath:keys/test-public.pem
    refresh:
      cookie-secure: false
