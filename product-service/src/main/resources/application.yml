spring:
  application:
    name: product-service
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:postgresql://localhost:5434/product_db}
    username: ${PRODUCT_DB_USERNAME:shopcore_product}
    password: ${PRODUCT_DB_PASSWORD:shopcore_product}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9092}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
